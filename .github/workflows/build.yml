name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build icon
        run: dotnet run --project tools/IconBuilder/IconBuilder.csproj -c Release -- assets
      - name: Build app
        run: dotnet build src/BS2Lite/BS2Lite.csproj -c Release
